# Example configuration for multi-provider setup
# Copy to ~/.config/acton-ai/config.toml or ./acton-ai.toml

default_provider = "ollama"

# Framework-wide defaults. Every prompt inherits these unless it calls
# `.max_tool_rounds(n)` on its own PromptBuilder. Omit the block to use
# the built-in fallback (10 rounds).
# [defaults]
# max_tool_rounds = 20

[providers.ollama]
type = "ollama"
model = "gemma4:26b"
# Change this to your Ollama server URL
base_url = "http://127.0.0.1:11434/v1"
timeout_secs = 300

[providers.ollama.rate_limit]
requests_per_minute = 1000
tokens_per_minute = 1000000

# Uncomment and add your API key to enable Claude
# [providers.claude]
# type = "anthropic"
# model = "claude-sonnet-4-20250514"
# api_key_env = "ANTHROPIC_API_KEY"

# Uncomment and add your API key to enable OpenAI
# [providers.fast]
# type = "openai"
# model = "gpt-4o-mini"
# api_key_env = "OPENAI_API_KEY"

# Sandbox configuration (optional)
# Uncomment to enable the portable ProcessSandbox for tool execution
# isolation. The parent re-execs the current binary, applies rlimits, and
# (on Linux) installs a best-effort landlock + seccomp filter before
# running the tool. No hypervisor required; works on Linux, macOS, and
# Windows.

# [sandbox]
# # OS-hardening policy: "off" | "besteffort" (default) | "enforce"
# hardening = "besteffort"
#
# [sandbox.limits]
# # Maximum execution time in milliseconds (default: 30000)
# max_execution_ms = 30000
# # Maximum memory (address space) in MB (default: 256)
# max_memory_mb = 256

# OpenTelemetry export (optional)
# Uncomment to export traces and metrics to an OTLP collector over
# HTTP/protobuf. Every prompt becomes an `acton_ai.turn` trace with a child
# span per provider round and per tool call; metrics cover tokens, latency,
# rate limits, and budget events.
#
# To look at the traces locally:
#   docker run --rm -p 4318:4318 -p 16686:16686 jaegertracing/jaeger:latest
# then browse http://localhost:16686.
#
# Requires the `otel` feature, which is on by default. A binary built without
# it fails to launch with this section present rather than ignoring it.

# [telemetry]
# # Required — its presence is what enables export.
# otlp_endpoint = "http://localhost:4318"
# # How traces and metrics are grouped in the backend (default: "acton-ai")
# service_name = "my-agent"
# # Periodic metrics reader interval in seconds (default: 60)
# metrics_interval_secs = 60
#
# # Optional, for authenticated collectors. Values are secrets and are never
# # printed by `acton-ai config`, which shows key names only.
# [telemetry.headers]
# authorization = "Bearer ..."
