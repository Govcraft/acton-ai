[package]
name = "acton-ai"
version = "0.30.0"
edition = "2021"
description = "An agentic AI framework where each agent is an actor"
license = "MIT"
repository = "https://github.com/rodzilla/acton-ai"
keywords = ["ai", "agents", "actors", "llm", "async"]
categories = ["asynchronous", "concurrency"]
include = [
    "src/**/*",
    "build.rs",
    "README.md",
    "LICENSE-MIT",
    "!docs/**/*",
]

# Explicit workspace root, so a checkout nested under another checkout (e.g. a
# git worktree in .claude/worktrees/) never resolves into the outer manifest's
# workspace. `default-members` names both packages because otherwise a bare
# `cargo clippy` / `cargo nextest run` here covers only the root package and
# the macros crate silently goes unchecked.
[workspace]
members = [".", "macros"]
default-members = [".", "macros"]
resolver = "2"

[features]
default = ["sandbox-hardening", "derive", "otel"]
# Enables Linux-specific OS hardening (landlock + seccomp) for the process
# sandbox child. A no-op on non-Linux platforms.
sandbox-hardening = ["dep:landlock", "dep:seccompiler", "dep:libc"]
# Enables the `#[tool]` attribute macro, which turns an annotated `async fn`
# into a `Tool` implementation. Independent of `sandbox-hardening`.
derive = ["dep:acton-ai-macros"]
# Enables OpenTelemetry export: OTLP traces over the prompt loop and metrics
# for tokens, latency, and reliability. Part of the default set so released
# binaries can be pointed at a collector without a rebuild; lean library
# consumers already build with `--no-default-features`.
#
# The OTLP transport is HTTP/protobuf backed by reqwest's *blocking* client,
# deliberately: `BatchSpanProcessor` and `PeriodicReader` both export from a
# dedicated `std::thread` via `futures_executor::block_on`, where an async
# client would have no reactor to drive its IO. No tonic, no gRPC stack.
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp"]

[dependencies]
# Actor framework (re-exports tokio)
acton-reactive = "9.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Identifiers (re-exports uuid)
mti = "1.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP client for LLM API calls
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "blocking", "rustls-tls"] }

# Async utilities
futures = "0.3"
async-stream = "0.3"
async-trait = "0.1.89"

# Configuration
toml = "0.8"
libsql = "0.9"
dirs = "6"
chrono = "0.4.43"

# Built-in tools
glob = "0.3"
walkdir = "2"
fasteval = "0.2"
regex = "1"
url = "2"

agent-skills = "0.2.0"
clap = { version = "4.6.0", features = ["derive", "env"] }
rlimit = "0.11.0"
tempfile = "3"
tracing-journald = "0.3.2"
tiktoken-rs = "0.11.0"
reedline = "0.47.0"
indicatif = "0.18.4"
strsim = "0.11.1"
termimad = "0.34.1"
rmcp = { version = "3.1.2", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
schemars = "1.2.2"
serde_path_to_error = "0.1.20"
acton-ai-macros = { version = "0.30.0", path = "macros", optional = true }
opentelemetry = { version = "0.32", optional = true }
opentelemetry_sdk = { version = "0.32", optional = true }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "metrics", "internal-logs"], optional = true }

[dev-dependencies]
anyhow = "1.0.100"
axum = "0.8.9"
colored = "3.1.1"
opentelemetry_sdk = { version = "0.32", features = ["testing"] }
rmcp = { version = "3.1.2", features = ["server", "transport-async-rw"] }
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
tokio-test = "0.4"
trybuild = "1.0.120"

# Targets that only compile with the feature they exercise. Without these,
# `--all-targets --no-default-features` fails on code that legitimately cannot
# build in that configuration, which hides real findings behind noise.
[[example]]
name = "tool_macro"
required-features = ["derive"]

[[test]]
name = "tool_macro"
required-features = ["derive"]

[target.'cfg(target_os = "linux")'.dependencies]
landlock = { version = "0.4.4", optional = true }
libc = { version = "0.2.186", optional = true }
seccompiler = { version = "0.5.0", optional = true }

[target."cfg(unix)".dependencies]
nix = { version = "0.31.2", features = ["signal"] }
